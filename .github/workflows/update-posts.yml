name: Update Scroll posts

on:
  schedule:
    # 06:00 JST
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-posts
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch posts and rebuild the page
        run: |
          python3 scripts/fetch_posts.py
          python3 scripts/build_page.py

      - name: Commit updates
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/fetched_on.txt public/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "no changes"
            exit 0
          fi
          git commit -m "Update Scroll posts"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5
        if: steps.commit.outputs.changed == 'true'
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Deploy to Cloudflare
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID が未設定のため、公開をスキップしました。"
            exit 0
          fi
          uv sync
          uv run pywrangler deploy
